<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzibly </title>
<style>
:root { --bg: #fbf4eb; --ink: #31231b; --faint: #72665e; --accent: #c2410c; --card: #fefbf7; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1d1714; --ink: #f3ebe4; --faint: #b8aca3; --accent: #fb923c; --card: #2a221d; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
.card { background: var(--card); border-radius: 18px; padding: 8px 24px 24px; }
h1 { font-size: 30px; line-height: 1.2; margin: 24px 0 8px; }
h2 { font-size: 22px; margin: 32px 0 8px; }
h3 { font-size: 18px; margin: 24px 0 4px; }
p, li { color: var(--ink); }
a { color: var(--accent); }
.brand { color: var(--accent); font-weight: 700; letter-spacing: 2px; font-size: 14px; }
footer { color: var(--faint); font-size: 14px; margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<main>
<div class="brand">PUZZIBLY</div>
<div class="card">
<h1>Puzzibly</h1>
<p>A puzzle game where you put things in order. Think. Sort. Discover.</p>
<ul>
<li><a href="privacy/">Privacy Policy</a></li>
</ul>
</div>
<footer>Puzzibly by iota &middot; <a href="mailto:puzzibly.studio@gmail.com">puzzibly.studio@gmail.com</a></footer>
</main>
</body>
</html>
